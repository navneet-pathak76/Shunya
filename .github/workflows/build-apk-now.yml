name: SUNYA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Configure Android build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.health.READ_STEPS" />'
          if permission not in s:
              s = s.replace("<manifest ", "<manifest " + "\n    " + permission, 1)
          p.write_text(s)

          main = Path("android/app/src/main/kotlin/com/example/apps/MainActivity.kt")
          if main.exists():
              s = main.read_text()
              s = s.replace("FlutterActivity", "FlutterFragmentActivity")
              main.write_text(s)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              s = gradle.read_text()
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  s = s.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }", 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs' not in s:
                  s = s.replace("dependencies {", 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")', 1)
              gradle.write_text(s)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
