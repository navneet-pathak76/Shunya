name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Regenerate Isar code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze Flutter project
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

  skeleton-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository structure check
        run: test -f README.md && test -f ARCHITECTURE.md && test -d apps && test -d backend && test -d docs
