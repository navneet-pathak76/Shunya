name: SUNYA Final Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Isar
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Health Connect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.ACTIVITY_RECOGNITION",
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_WEIGHT",
              "android.permission.health.READ_HEIGHT",
              "android.permission.health.READ_BODY_FAT",
              "android.permission.health.READ_BODY_MASS_INDEX",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_RESTING_HEART_RATE",
              "android.permission.health.READ_HEART_RATE_VARIABILITY",
              "android.permission.health.READ_BLOOD_OXYGEN",
              "android.permission.health.READ_BLOOD_PRESSURE",
              "android.permission.health.READ_BLOOD_GLUCOSE",
              "android.permission.health.READ_BODY_TEMPERATURE",
              "android.permission.health.READ_RESPIRATORY_RATE",
              "android.permission.health.READ_BODY_WATER_MASS",
              "android.permission.health.READ_BASAL_METABOLIC_RATE",
              "android.permission.health.READ_BASAL_BODY_TEMPERATURE",
              "android.permission.health.READ_HYDRATION",
              "android.permission.health.READ_SLEEP",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_TOTAL_CALORIES_BURNED",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_EXERCISE",
              "android.permission.health.READ_NUTRITION",
              "android.permission.health.READ_HEALTH_DATA_HISTORY",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if tag not in text:
                  text = text.replace("</manifest>", f"    {tag}\n</manifest>", 1)

          if "<queries>" not in text:
              queries = """    <queries>
                <package android:name="com.google.android.apps.healthdata" />
                <intent>
                    <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                </intent>
            </queries>
          """
              text = text.replace("</manifest>", queries + "</manifest>", 1)

          manifest.write_text(text)

          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"), None)
          if main:
              activity = main.read_text()
              activity = activity.replace(
                  "import io.flutter.embedding.android.FlutterActivity",
                  "import io.flutter.embedding.android.FlutterFragmentActivity",
              )
              activity = activity.replace("FlutterActivity", "FlutterFragmentActivity")
              main.write_text(activity)
          PY

      - name: Patch Isar namespace
        shell: bash
        run: |
          ISAR="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR" ] && ! grep -q "namespace" "$ISAR"; then
            sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR"
          fi

      - name: Android API and desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          text = p.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }",
                  1,
              )

          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dependency not in text:
              text = text.replace("dependencies {", "dependencies {\n    " + dependency, 1)

          text = re.sub(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36", text, count=1)
          text = re.sub(r"minSdk\s*=\s*[^\n]+", "minSdk = 26", text, count=1)

          if "minSdk = 26" not in text:
              text = text.replace("defaultConfig {", "defaultConfig {\n        minSdk = 26", 1)

          p.write_text(text)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-final-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
