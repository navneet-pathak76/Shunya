name: SUNYA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy Android plugin namespaces
        run: |
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ] && ! grep -q "namespace" "$ISAR_GRADLE"; then
            sed -i '/android {/a\\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_GRADLE"
          fi

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              marker = "compileOptions {"
              if marker in s:
                  s = s.replace(marker, marker + "\n        isCoreLibraryDesugaringEnabled = true", 1)
              else:
                  raise SystemExit("compileOptions block not found")
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:' not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY

      - name: Verify Android Gradle configuration
        run: |
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts
          grep -n "coreLibraryDesugaring" android/app/build.gradle.kts

      - name: Configure Android API level
        run: |
          yes | sdkmanager "platforms;android-36" || true
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          import re
          s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          if n == 0:
              raise SystemExit("compileSdk declaration not found")
          p.write_text(s)
          PY
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Patch plugin Android API levels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patched = []
          for p in root.glob("*/android/build.gradle*"):
              s = p.read_text(errors="ignore")
              original = s
              s = re.sub(r'compileSdkVersion\s+34\b', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdk\s*=\s*34\b', 'compileSdk = 36', s)
              s = re.sub(r'compileSdk\s+34\b', 'compileSdk 36', s)
              if s != original:
                  p.write_text(s)
                  patched.append(str(p))
          print("Patched Android plugin API levels:")
          for p in patched:
              print(p)

      - name: Normalize all legacy plugin Android API levels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patched = []
          for p in root.glob("*/android/build.gradle*"):
              s = p.read_text(errors="ignore")
              original = s
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
              s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
              if s != original:
                  p.write_text(s)
                  patched.append(str(p))
          print("Patched:", len(patched))
          for p in patched:
              print(p)

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload SUNYA APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
