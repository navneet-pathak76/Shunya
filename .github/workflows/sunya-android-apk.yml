name: SUNYA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Configure Health Connect native project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          permissions = [
              "android.permission.ACTIVITY_RECOGNITION",
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_WEIGHT",
              "android.permission.health.READ_HEIGHT",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_RESTING_HEART_RATE",
              "android.permission.health.READ_HEART_RATE_VARIABILITY",
              "android.permission.health.READ_BLOOD_OXYGEN",
              "android.permission.health.READ_HYDRATION",
              "android.permission.health.READ_SLEEP",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_TOTAL_CALORIES_BURNED",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_EXERCISE",
              "android.permission.health.READ_NUTRITION",
          ]
          insert = ''.join(f'\n    <uses-permission android:name="{p}"/>' for p in permissions)
          if "android.permission.health.READ_STEPS" not in s:
              s = s.replace('>', '>' + insert, 1)
          queries = '''\n    <queries>\n        <package android:name="com.google.android.apps.healthdata" />\n        <intent><action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" /></intent>\n    </queries>'''
          if '<queries>' not in s:
              s = s.replace(insert, insert + queries, 1)
          manifest.write_text(s)
          PY

          MAIN=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          if [ -n "$MAIN" ]; then
            python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("import io.flutter.embedding.android.FlutterActivity", "import io.flutter.embedding.android.FlutterFragmentActivity")
          s = s.replace("class MainActivity: FlutterActivity()", "class MainActivity: FlutterFragmentActivity()")
          p.write_text(s)
          PY
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy Android plugin namespaces
        run: |
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ] && ! grep -q "namespace" "$ISAR_GRADLE"; then
            sed -i '/android {/a    namespace "dev.isar.isar_flutter_libs"' "$ISAR_GRADLE"
          fi

      - name: Configure Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dep not in s:
              marker = "dependencies {"
              if marker in s:
                  s = s.replace(marker, marker + "\n    " + dep, 1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
          p.write_text(s)
          print("Configured core library desugaring.")
          PY
          grep -n "isCoreLibraryDesugaringEnabled" android/app/build.gradle.kts
          grep -n "coreLibraryDesugaring" android/app/build.gradle.kts

      - name: Configure Android API level
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
          if n == 0:
              raise SystemExit("compileSdk declaration not found")
          p.write_text(s)
          PY

      - name: Normalize plugin Android API levels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for p in root.glob("*/android/build.gradle*"):
              s = p.read_text(errors="ignore")
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
              s = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', s)
              p.write_text(s)

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload SUNYA APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
