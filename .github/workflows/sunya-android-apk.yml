name: SUNYA Android APK Build

concurrency:
  group: sunya-android-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Apply SUNYA launcher branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/sunya_logo.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path android:fillColor="#050608" android:pathData="M112,0 L400,0 Q512,0 512,112 L512,400 Q512,512 400,512 L112,512 Q0,512 0,400 L0,112 Q0,0 112,0Z"/>
              <path android:strokeColor="#F5F5F5" android:strokeWidth="28" android:fillColor="@android:color/transparent" android:strokeLineCap="round" android:pathData="M238,256 C200,180 149,138 106,167 C52,204 66,289 118,321 C172,355 218,324 238,280"/>
              <path android:strokeColor="#D4AF37" android:strokeWidth="28" android:fillColor="@android:color/transparent" android:strokeLineCap="round" android:pathData="M274,256 C312,332 363,374 406,345 C460,308 446,223 394,191 C340,157 294,188 274,232"/>
              <path android:strokeColor="#D4AF37" android:strokeWidth="4" android:fillColor="@android:color/transparent" android:pathData="M256,92 L256,420"/>
              <path android:fillColor="#D4AF37" android:pathData="M269,256 A13,13 0,1 1,243,256 A13,13 0,1 1,269,256"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/sunya_logo"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/sunya_logo"')
          p.write_text(s)
          PY

      - name: Configure Health Connect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          permissions = [
              "android.permission.ACTIVITY_RECOGNITION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_WEIGHT",
              "android.permission.health.READ_HEIGHT",
              "android.permission.health.READ_BODY_FAT",
              "android.permission.health.READ_BODY_MASS_INDEX",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_RESTING_HEART_RATE",
              "android.permission.health.READ_HEART_RATE_VARIABILITY",
              "android.permission.health.READ_OXYGEN_SATURATION",
              "android.permission.health.READ_BLOOD_PRESSURE",
              "android.permission.health.READ_BLOOD_GLUCOSE",
              "android.permission.health.READ_BODY_TEMPERATURE",
              "android.permission.health.READ_RESPIRATORY_RATE",
              "android.permission.health.READ_HYDRATION",
              "android.permission.health.READ_SLEEP",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_BASAL_ENERGY_BURNED",
              "android.permission.health.READ_TOTAL_CALORIES_BURNED",
              "android.permission.health.READ_EXERCISE",
              "android.permission.health.READ_NUTRITION",
              "android.permission.health.READ_BODY_WATER_MASS",
              "android.permission.health.READ_BASAL_METABOLIC_RATE",
              "android.permission.health.READ_HEALTH_DATA_HISTORY",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if tag not in s:
                  s = s.replace("</manifest>", f"    {tag}\n</manifest>", 1)

          if "<queries>" not in s:
              queries = """    <queries>
                <package android:name="com.google.android.apps.healthdata" />
                <intent>
                    <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
                </intent>
            </queries>
            """
              s = s.replace("</manifest>", queries + "</manifest>", 1)

          manifest.write_text(s)

          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"), None)
          if main:
              text = main.read_text()
              text = text.replace(
                  "import io.flutter.embedding.android.FlutterActivity",
                  "import io.flutter.embedding.android.FlutterFragmentActivity",
              )
              text = text.replace("FlutterActivity", "FlutterFragmentActivity")
              main.write_text(text)
          PY

      - name: Patch legacy Isar namespace
        shell: bash
        run: |
          set -euo pipefail
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ] && ! grep -q "namespace" "$ISAR_GRADLE"; then
            sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_GRADLE"
          fi

      - name: Configure Android desugaring and API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app")
          gradle = app / "build.gradle"
          kts = app / "build.gradle.kts"
          p = gradle if gradle.exists() else kts
          s = p.read_text()

          if p.suffix == ".kts":
              if "isCoreLibraryDesugaringEnabled = true" not in s:
                  s = s.replace(
                      "android {",
                      "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }",
                      1,
                  )
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          else:
              if "coreLibraryDesugaringEnabled true" not in s:
                  s = s.replace(
                      "android {",
                      "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }",
                      1,
                  )
              dep = 'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"'

          if "desugar_jdk_libs" not in s:
              s += "\n\ndependencies {\n    " + dep + "\n}\n"

          s = re.sub(r"compileSdk(?:Version|\s*=|\s+)\s*\d+", "compileSdk = 36" if p.suffix == ".kts" else "compileSdkVersion 36", s, count=1)
          if p.suffix == ".kts":
              if "minSdk = 26" not in s:
                  s = re.sub(r"minSdk\s*=\s*\d+", "minSdk = 26", s, count=1)
          else:
              if "minSdkVersion 26" not in s:
                  s = re.sub(r"minSdkVersion\s+\d+", "minSdkVersion 26", s, count=1)

          p.write_text(s)
          print("Configured", p)
          PY

      - name: Normalize plugin Android API levels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for p in root.glob("*/android/build.gradle*"):
              s = p.read_text(errors="ignore")
              s = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", s)
              s = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", s)
              s = re.sub(r"compileSdk\s+\d+", "compileSdk 36", s)
              p.write_text(s)

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=SUNYA_ADMIN_EMAIL="${SUNYA_ADMIN_EMAIL:-}" 
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          SUNYA_ADMIN_EMAIL: ${{ secrets.SUNYA_ADMIN_EMAIL }}

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload SUNYA APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
