name: SUNYA Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Isar sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Configure Health Connect native project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          permissions = [
              "android.permission.ACTIVITY_RECOGNITION",
              "android.permission.health.READ_STEPS",
              "android.permission.health.READ_WEIGHT",
              "android.permission.health.READ_HEIGHT",
              "android.permission.health.READ_HEART_RATE",
              "android.permission.health.READ_RESTING_HEART_RATE",
              "android.permission.health.READ_HEART_RATE_VARIABILITY",
              "android.permission.health.READ_BLOOD_OXYGEN",
              "android.permission.health.READ_HYDRATION",
              "android.permission.health.READ_SLEEP",
              "android.permission.health.READ_ACTIVE_CALORIES_BURNED",
              "android.permission.health.READ_TOTAL_CALORIES_BURNED",
              "android.permission.health.READ_DISTANCE",
              "android.permission.health.READ_EXERCISE",
              "android.permission.health.READ_NUTRITION",\n              "android.permission.health.READ_HEIGHT",\n              "android.permission.health.READ_BODY_FAT",\n              "android.permission.health.READ_BLOOD_PRESSURE",\n              "android.permission.health.READ_BLOOD_GLUCOSE",\n              "android.permission.health.READ_BODY_TEMPERATURE",\n              "android.permission.health.READ_RESPIRATORY_RATE",\n              "android.permission.health.READ_BODY_WATER_MASS",\n              "android.permission.health.READ_BASAL_METABOLIC_RATE",\n              "android.permission.health.READ_BASAL_BODY_TEMPERATURE",\n              "android.permission.health.READ_BLOOD_PRESSURE",\n              "android.permission.health.READ_WAIST_CIRCUMFERENCE",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}"/>'
              if tag not in s:
                  s = s.replace("</manifest>", f"    {tag}\n</manifest>", 1)

          queries = '''    <queries>
              <package android:name="com.google.android.apps.healthdata" />
              <intent>
                  <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE" />
              </intent>
          </queries>
          '''
          if "<queries>" not in s:
              s = s.replace("</manifest>", queries + "</manifest>", 1)

          manifest.write_text(s)

          main = next(Path("android/app/src/main/kotlin").rglob("MainActivity.kt"), None)
          if main:
              s = main.read_text()
              s = s.replace(
                  "import io.flutter.embedding.android.FlutterActivity",
                  "import io.flutter.embedding.android.FlutterFragmentActivity",
              )
              s = s.replace("FlutterActivity", "FlutterFragmentActivity")
              main.write_text(s)
          PY

      - name: Patch legacy Isar Android namespace
        shell: bash
        run: |
          set -euo pipefail
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ] && ! grep -q "namespace" "$ISAR_GRADLE"; then
            sed -i '/android {/a\    namespace "dev.isar.isar_flutter_libs"' "$ISAR_GRADLE"
          fi

      - name: Configure Android desugaring and API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              if "compileOptions {" in s:
                  s = s.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              else:
                  s = s.replace(
                      "android {",
                      "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }",
                      1,
                  )

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dep not in s:
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"

          s, n = re.subn(r"compileSdk\s*=\s*[^\n]+", "compileSdk = 36", s, count=1)
          if n == 0:
              raise SystemExit("compileSdk declaration not found")

          if "minSdk = 26" not in s:
              s, n = re.subn(r"minSdk\s*=\s*[^\n]+", "minSdk = 26", s, count=1)
              if n == 0:
                  s = s.replace(
                      "defaultConfig {",
                      "defaultConfig {\n        minSdk = 26",
                      1,
                  )

          p.write_text(s)
          PY

      - name: Normalize plugin Android API levels
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          for p in root.glob("*/android/build.gradle*"):
              s = p.read_text(errors="ignore")
              s = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", s)
              s = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", s)
              s = re.sub(r"compileSdk\s+\d+", "compileSdk 36", s)
              p.write_text(s)

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload SUNYA APK
        uses: actions/upload-artifact@v4
        with:
          name: sunya-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
